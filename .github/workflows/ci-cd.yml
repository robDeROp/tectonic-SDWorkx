name: CI / CD
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clarity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: ticket_studio
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U demo -d ticket_studio"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://demo:demo@127.0.0.1:54329/ticket_studio
      TASK_BACKEND: local
      STORAGE_BACKEND: local
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
      - name: Test standalone health endpoint
        run: |
          PORT=8080 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/api/health
  infrastructure:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra/bootstrap init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/bootstrap validate
      - run: bash -n scripts/bootstrap-cloud.sh scripts/deploy.sh
      - run: python3 scripts/test-deploy.py
  deploy:
    name: Deploy to Google Cloud
    needs: [verify, infrastructure]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check cloud configuration
        run: |
          : "${GCP_PROJECT_ID:?Run scripts/bootstrap-cloud.sh first}"
          : "${GCP_REGION:?Missing GCP_REGION}"
          : "${GCP_DEPLOY_SERVICE_ACCOUNT:?Missing deployment identity}"
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Missing identity provider}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Build before requesting short-lived Google credentials.
      - name: Build application
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runner
          load: true
          tags: clarity-app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build migration tools
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: tools
          load: true
          tags: clarity-tools:${{ github.sha }}
          cache-from: type=gha,scope=app
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Push immutable images
        id: images
        run: |
          registry="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/clarity"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          for target in app tools; do
            image="${registry}/${target}:${GITHUB_SHA}"
            docker tag "clarity-${target}:${GITHUB_SHA}" "$image"
            docker push "$image"
            digest="$(gcloud artifacts docker images describe "$image" --format='value(image_summary.digest)')"
            echo "${target}=${registry}/${target}@${digest}" >> "$GITHUB_OUTPUT"
          done
      - name: Migrate, verify and release
        env:
          APP_IMAGE: ${{ steps.images.outputs.app }}
          TOOLS_IMAGE: ${{ steps.images.outputs.tools }}
          RELEASE_ID: r${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/deploy.sh
