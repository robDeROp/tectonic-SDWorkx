<svg xmlns="http://www.w3.org/2000/svg" class="hn-pip hn-pip-found" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Pip has found context"><style>.hn-pip {
  display: inline-block;
  overflow: visible;
}
.hn-pip .pip-line {
  stroke: #12343B;
}
.hn-pip .pip-fill-line {
  fill: #12343B;
}
.hn-pip .pip-shadow {
  fill: #12343B;
  opacity: 0.12;
}
.hn-pip-working .pip-bob {
  animation: hn-bob 1.1s ease-in-out infinite alternate;
}
.hn-pip-working .pip-lens {
  animation: hn-sweep 1.6s ease-in-out infinite alternate;
  transform-box: view-box;
  transform-origin: 160px 122px;
}
.hn-pip .pip-spark {
  transform-box: view-box;
  transform-origin: 113px 31px;
}
.hn-pip-working .pip-spark {
  animation: hn-pulse 0.9s ease-in-out infinite alternate;
}
.hn-pip-working .pip-look {
  animation: hn-look 3.2s ease-in-out infinite;
}
.hn-pip .pip-eyes {
  animation: hn-blink 4s infinite;
  transform-box: view-box;
  transform-origin: 100px 108px;
}
.hn-pip-found .pip-bob {
  animation: hn-hop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1) 1;
}


@keyframes hn-bob {
  from {
    transform: translateY(0);
  }
  to {
    transform: translateY(-6px);
  }
}
@keyframes hn-sweep {
  from {
    transform: rotate(-14deg);
  }
  to {
    transform: rotate(10deg);
  }
}
@keyframes hn-pulse {
  from {
    transform: scale(0.75) rotate(0);
    opacity: 0.75;
  }
  to {
    transform: scale(1.15) rotate(45deg);
    opacity: 1;
  }
}
@keyframes hn-look {
  0%,
  40% {
    transform: translateX(4px);
  }
  50%,
  90% {
    transform: translateX(-3px);
  }
  100% {
    transform: translateX(4px);
  }
}
@keyframes hn-blink {
  0%,
  92%,
  100% {
    transform: scaleY(1);
  }
  95% {
    transform: scaleY(0.1);
  }
}
@keyframes hn-hop {
  0% {
    transform: translateY(0);
  }
  40% {
    transform: translateY(-14px);
  }
  100% {
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) { .hn-pip * { animation: none !important; } }</style><ellipse class="pip-shadow" cx="100" cy="182" rx="46" ry="6"></ellipse><g class="pip-bob"><path d="M100,67 C100,54 106,46 111,38" stroke-width="4" class="pip-line" fill="none" stroke-linecap="round"></path><path class="pip-spark" d="M113,19 Q113,31 125,31 Q113,31 113,43 Q113,31 101,31 Q113,31 113,19 Z" fill="#FFC53D"></path><path d="M140,23 Q140,28 145,28 Q140,28 140,33 Q140,28 135,28 Q140,28 140,23 Z M84,30 Q84,34 88,34 Q84,34 84,38 Q84,34 80,34 Q84,34 84,30 Z" fill="#FFC53D"></path><ellipse class="pip-fill-line" cx="80" cy="166" rx="10" ry="6"></ellipse><ellipse class="pip-fill-line" cx="120" cy="166" rx="10" ry="6"></ellipse><path stroke-width="5" d="M44,112 L26,92 M156,112 L174,92" class="pip-line" fill="none" stroke-linecap="round"></path><path d="M62,67 H138 A22,22 0 0 1 160,89 V105 A10,10 0 0 0 160,125 V141 A22,22 0 0 1 138,163 H62 A22,22 0 0 1 40,141 V125 A10,10 0 0 0 40,105 V89 A22,22 0 0 1 62,67 Z" fill="#FF7A50"></path><path d="M58,151 H142" stroke="#FFF8EF" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9" opacity="0.9"></path><g><path d="M72,110 Q82,98 92,110 M108,110 Q118,98 128,110" fill="none" stroke="#12343B" stroke-width="5" stroke-linecap="round"></path><path d="M88,126 Q100,140 112,126 Z" fill="#12343B"></path></g><circle cx="68" cy="127" r="6" fill="#FFB59A"></circle><circle cx="132" cy="127" r="6" fill="#FFB59A"></circle></g></svg>
